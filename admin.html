<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>管理 | 新竹吃什麼</title>
  <meta name="theme-color" content="#FBF7EA">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <h1>管理</h1>
    </div>
    <a class="back" href="./">回到清單</a>
  </header>

  <main class="admin">
    <p class="muted" id="loading">載入中</p>
    <section class="panel" id="panel-login" hidden aria-labelledby="login-title">
      <h2 id="login-title">登入</h2>
      <p class="muted">輸入你的信箱，我們會寄一個登入連結給你，點開就能登入，不需要密碼。</p>
      <form id="login-form" class="row">
        <label class="field">
          <span class="sr">信箱</span>
          <input type="email" id="login-email" required autocomplete="email" placeholder="you@example.com">
        </label>
        <button type="submit" class="btn-primary" id="login-btn">寄登入連結</button>
      </form>
      <p class="status" id="login-status" aria-live="polite"></p>
    </section>

    <section class="panel" id="panel-denied" hidden aria-labelledby="denied-title">
      <h2 id="denied-title">這個帳號沒有管理權限</h2>
      <p class="muted" id="denied-email"></p>
      <p class="muted">管理權限看的是資料庫裡的白名單。如果這是你的信箱，請確認白名單裡的信箱和這裡的一樣。</p>
      <button type="button" class="btn-secondary" id="denied-logout">登出</button>
    </section>

    <div id="panel-main" hidden>
      <section class="panel" aria-labelledby="places-title">
        <div class="panel-head">
          <h2 id="places-title">補齊地址、營業時間與價位</h2>
          <button type="button" class="btn-text" id="logout">登出</button>
        </div>
        <p class="muted">
          用 Google Places 查每間店，每間只查一次，查過的不會重複。每次最多處理 20 間，按一次會自動連續跑到沒有為止。
        </p>
        <dl class="stats">
          <div><dt>全部餐廳</dt><dd id="stat-total">載入中</dd></div>
          <div><dt>還沒查過</dt><dd id="stat-todo">載入中</dd></div>
        </dl>
        <div class="row actions">
          <button type="button" class="btn-primary" id="run-btn">開始補齊</button>
          <button type="button" class="btn-secondary" id="dry-btn">先試跑，不呼叫 Google</button>
          <button type="button" class="btn-secondary" id="stop-btn" hidden>停止</button>
        </div>
        <ol class="log" id="log" aria-live="polite"></ol>
      </section>
    </div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
